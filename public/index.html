<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AcolheBem — Gestão Hoteleira</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --navy:#0f2d52;--orange:#e86c1a;--orange-light:#fdf0e6;
  --bg:#f8f9fa;--bg2:#ffffff;--border:#e5e7eb;
  --text:#1a1a1a;--text2:#6b7280;--green:#2e7d32;--red:#c62828;
}
body{font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);display:flex;height:100vh;overflow:hidden}

/* SIDEBAR */
.sidebar{width:210px;min-width:210px;background:var(--navy);display:flex;flex-direction:column;overflow-y:auto}
.logo-area{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,0.1)}
.logo-icon{width:38px;height:38px;background:var(--orange);border-radius:8px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.logo-icon i{color:#fff;font-size:20px}
.logo-name{font-size:16px;font-weight:600;color:#fff}
.logo-sub{font-size:11px;color:rgba(255,255,255,0.5);margin-top:2px}
.nav{padding:10px 0;flex:1}
.nav-section{font-size:10px;color:rgba(255,255,255,0.3);padding:12px 16px 4px;letter-spacing:1px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:13px;color:rgba(255,255,255,0.65);cursor:pointer;border-left:3px solid transparent;transition:all 0.15s}
.nav-item:hover{color:#fff;background:rgba(255,255,255,0.06)}
.nav-item.active{color:#fff;background:rgba(232,108,26,0.18);border-left-color:var(--orange)}
.nav-item i{font-size:17px}
.hotel-badge{margin:0 12px 14px;background:rgba(255,255,255,0.08);border-radius:8px;padding:10px 12px}
.hotel-nm{font-size:12px;color:rgba(255,255,255,0.85);font-weight:500}
.hotel-pl{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}

/* MAIN */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.page{display:none;flex:1;flex-direction:column;overflow:hidden}
.page.active{display:flex}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid var(--border);background:#fff}
.topbar-title{font-size:17px;font-weight:600;color:var(--text)}
.topbar-sub{font-size:12px;color:var(--text2);margin-top:2px}

/* BUTTONS */
.btn{padding:8px 16px;border-radius:7px;font-size:13px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:6px;transition:opacity 0.15s}
.btn:hover{opacity:0.88}
.btn-primary{background:var(--orange);color:#fff}
.btn-secondary{background:none;border:1px solid var(--border);color:var(--text2)}
.btn-success{background:#e8f5e9;color:var(--green);border:1px solid #a5d6a7}
.btn-danger{background:#ffebee;color:var(--red);border:1px solid #ffcdd2}

/* CONTENT AREA */
.content{flex:1;overflow-y:auto;padding:20px 24px}

/* CARDS */
.cards-grid{display:grid;gap:12px}
.cards-4{grid-template-columns:repeat(4,1fr)}
.cards-3{grid-template-columns:repeat(3,1fr)}
.cards-2{grid-template-columns:repeat(2,1fr)}
.card{background:#fff;border:1px solid var(--border);border-radius:10px;padding:14px 16px}
.card-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.card-val{font-size:22px;font-weight:600;color:var(--text)}
.card-sub{font-size:11px;color:var(--text2);margin-top:3px}
.card-orange .card-val{color:var(--orange)}
.card-green .card-val{color:var(--green)}
.card-red .card-val{color:var(--red)}

/* FORM */
.form-section{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.form-section-header{display:flex;align-items:center;gap:8px;padding:11px 16px;background:#f9fafb;border-bottom:1px solid var(--border)}
.form-section-header i{color:var(--orange);font-size:16px}
.form-section-title{font-size:13px;font-weight:600;color:var(--text)}
.form-body{padding:16px}
.form-grid{display:grid;gap:12px}
.cols-2{grid-template-columns:1fr 1fr}
.cols-3{grid-template-columns:1fr 1fr 1fr}
.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
.col-full{grid-column:1/-1}
.field label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);background:#fff;outline:none;transition:border-color 0.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--orange)}
.field textarea{resize:none;height:60px}
.required{color:var(--orange)}
.calc-box{background:#f9fafb;border:1px solid var(--border);border-radius:8px;padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-top:10px}
.calc-label{font-size:12px;color:var(--text2)}
.calc-val{font-size:20px;font-weight:600;color:var(--orange)}
.nights-pill{display:inline-flex;align-items:center;gap:4px;background:var(--orange-light);color:var(--orange);font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px;margin-top:6px}

/* FORM FOOTER */
.form-footer{padding:14px 24px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:#fff}

/* TABLE */
.table-wrap{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th{font-size:11px;font-weight:600;color:var(--text2);padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;background:#f9fafb;text-transform:uppercase;letter-spacing:0.5px}
td{font-size:13px;color:var(--text);padding:10px 14px;border-bottom:1px solid var(--border)}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafafa}

/* STATUS BADGES */
.badge{font-size:11px;font-weight:500;padding:3px 9px;border-radius:20px}
.badge-green{background:#e8f5e9;color:var(--green)}
.badge-red{background:#ffebee;color:var(--red)}
.badge-orange{background:var(--orange-light);color:var(--orange)}
.badge-gray{background:#f5f5f5;color:#666}

/* AVAILABILITY CARDS */
.avail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.avail-card{border-radius:10px;overflow:hidden;border:1px solid var(--border);cursor:pointer;transition:transform 0.1s}
.avail-card:hover{transform:translateY(-2px)}
.avail-header{padding:10px 12px;display:flex;align-items:center;justify-content:space-between}
.avail-header.livre{background:#e8f5e9}
.avail-header.ocupado{background:#ffebee}
.avail-room{font-size:19px;font-weight:600}
.avail-room.livre{color:var(--green)}
.avail-room.ocupado{color:var(--red)}
.avail-body{padding:10px 12px;background:#fff}
.avail-info{font-size:11px;color:var(--text2);margin-bottom:3px;display:flex;align-items:center;gap:4px}

/* SEARCH BAR */
.search-bar{padding:14px 24px;background:#fff;border-bottom:1px solid var(--border);display:flex;align-items:flex-end;gap:12px}
.search-field label{font-size:11px;font-weight:500;color:var(--text2);display:block;margin-bottom:4px}
.search-field input{padding:8px 11px;border:1px solid var(--border);border-radius:6px;font-size:13px;color:var(--text);width:160px;outline:none}
.search-field input:focus{border-color:var(--orange)}

/* SUMMARY BAR */
.summary-bar{padding:10px 24px;background:#fff;border-top:1px solid var(--border);display:flex;gap:20px}
.sum-item{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2)}
.sum-dot{width:10px;height:10px;border-radius:2px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:12px;width:340px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,0.2)}
.modal-header{padding:14px 18px;display:flex;align-items:center;justify-content:space-between}
.modal-header.occ{background:#ffebee}
.modal-header.free{background:#e8f5e9}
.modal-title{font-size:14px;font-weight:600}
.modal-title.occ{color:var(--red)}
.modal-title.free{color:var(--green)}
.modal-close{background:none;border:none;cursor:pointer;font-size:18px;line-height:1}
.modal-body{padding:16px 18px}
.modal-row{display:flex;gap:8px;margin-bottom:10px}
.modal-row i{font-size:16px;color:var(--text2);margin-top:1px}
.modal-row-label{font-size:11px;color:var(--text2)}
.modal-row-val{font-size:13px;font-weight:500;color:var(--text)}
.modal-footer{padding:12px 18px;border-top:1px solid var(--border);display:flex;gap:8px}

/* CAFE TABLE */
.cafe-section{background:#fff;border:1px solid var(--border);border-radius:10px;margin-bottom:14px;overflow:hidden}
.cafe-section-header{padding:11px 16px;background:#f9fafb;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.cafe-section-header i{color:var(--orange)}

/* LOADING */
.loading{text-align:center;padding:40px;color:var(--text2)}
.loading i{font-size:32px;display:block;margin-bottom:10px;color:var(--border)}

/* TOAST */
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;z-index:200;transform:translateY(100px);transition:transform 0.3s;display:flex;align-items:center;gap:8px}
.toast.show{transform:translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* Configuracao estrita de impressao sem caracteres especiais */

  html, body {
    background: #ffffff !important;
    color: #000000 !important;
    padding: 0 !important;
    margin: 0 !important;
    height: auto !important;
    display: block !important;
  }
  
  /* Oculta completamente o menu, topo, filtros e cards de resumo */
  .sidebar, 
  .topbar, 
  .search-bar, 
  .form-footer, 
  .cards-grid, 
  button, 
  .btn,
  .logo-area,
  .nav,
  .hotel-badge {
    display: none !important;
    visibility: hidden !important;
    width: 0 !important;
    height: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  /* Forca a area principal a assumir largura total na folha */
  .main {
    display: block !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
    position: absolute !important;
    left: 0 !important;
    top: 0 !important;
  }
  
  .page {
    display: none !important;
  }
  
  .page.active {
    display: block !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  .content {
    display: block !important;
    width: 100% !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  
  /* Formata a secao e a tabela do cafe para o papel */
  .cafe-section {
    border: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }
  
  .cafe-section-header {
    font-size: 16px !important;
    font-weight: bold !important;
    color: #000000 !important;
    margin-bottom: 15px !important;
    background: transparent !important;
    padding: 0 !important;
  }
  
  .table-wrap {
    width: 100% !important;
    border: 1px solid #000000 !important;
